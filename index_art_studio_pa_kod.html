<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ILIR SHEHU ART STUDIO</title><style>body{margin:0;background:#f6f4ef;color:#292720;font:16px system-ui}header{background:#1c2321;color:white;padding:25px;text-align:center}h1{font:normal clamp(32px,7vw,52px) Georgia}main{max-width:1050px;margin:auto;padding:20px}button,input,select{font:inherit;padding:12px;border:1px solid #aaa;border-radius:9px;margin:5px}button{background:#24342e;color:white;cursor:pointer}input{max-width:95%;box-sizing:border-box}.panel{background:white;border-radius:12px;padding:18px;margin:25px 0}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.art{background:white;border-radius:12px;overflow:hidden}.art img{width:100%;height:250px;object-fit:cover}.art p{padding:12px}.hide{display:none}#viewer{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center}#viewer img{max-width:95vw;max-height:85vh}#viewer button{position:absolute;right:10px;top:10px}.center{text-align:center}</style></head><body><header><strong>ILIR SHEHU · ART STUDIO</strong><p><select id="lang"><option value="sq">Shqip</option><option value="sv">Svenska</option><option value="en">English</option></select></p></header><main><section class="center"><h1 id="heading"></h1><p id="intro"></p><div id="filters"><button data-cat="all"></button><button data-cat="painting"></button><button data-cat="drawing"></button><button data-cat="sculpture"></button></div></section><div id="gallery"></div><p id="empty" class="center"></p><section class="panel"><h2 id="contact"></h2><p id="contactdesc"></p><a href="mailto:ilia.mitro@yahoo.gr">ilia.mitro@yahoo.gr</a></section><section class="panel"><h2>Menaxho fotografitë</h2><p id="adminNote">Fotografitë mund të shtohen ose fshihen vetëm nga një pajisje me sesion administratori të autorizuar. Nuk kërkohet kod për të parë galerinë.</p><div id="controls" class="hide"><p><input id="title" placeholder="Titulli i veprës"><select id="category"><option value="sculpture">Skulpturë</option><option value="painting">Pikturë</option><option value="drawing">Vizatim</option></select></p><input id="photo" type="file" accept="image/*"><button id="upload">Shto foto</button><div id="manage"></div></div><p id="status" role="status"></p></section></main><div id="viewer"><button id="close">Mbyll ✕</button><img id="large" alt="Vepër artistike"></div><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://kkxuuiejdtsahvmqxdja.supabase.co', $=id=>document.getElementById(id);let db,user,works=[],cat='all';const tr={sq:['Galeria ime artistike','Piktura, vizatime dhe skulptura nga Ilir Shehu','Të gjitha','Piktura','Vizatime','Skulptura','Albumi është ende bosh.','Porosi artistike','Portrete, piktura, vizatime dhe skulptura me porosi.'],sv:['Mitt konstgalleri','Målningar, teckningar och skulpturer av Ilir Shehu','Alla','Målningar','Teckningar','Skulpturer','Galleriet är ännu tomt.','Beställ konst','Porträtt, målningar, teckningar och skulpturer på beställning.'],en:['My art gallery','Paintings, drawings and sculptures by Ilir Shehu','All','Paintings','Drawings','Sculptures','The gallery is empty for now.','Commission art','Custom portraits, paintings, drawings and sculptures.']};const status=s=>$('status').textContent=s;function photoUrl(a){const path=a.image_path||'';if(/^https?:\/\//.test(path))return path;return db.storage.from('art-studio').getPublicUrl(path).data.publicUrl}function imageFallback(img,a){img.onerror=()=>{img.onerror=null;img.alt='Fotografia nuk mund të shfaqet';img.style.objectFit='contain';img.style.padding='12px';img.style.boxSizing='border-box';img.removeAttribute('src');status('Fotografitë nuk lexohen nga Storage. Kontrollo që bucket art-studio është Public dhe politikat e leximit.')}}function render(){const t=tr[$('lang').value];['heading','intro'].forEach((k,i)=>$(k).textContent=t[i]);['all','painting','drawing','sculpture'].forEach((k,i)=>{const b=document.querySelector('[data-cat="'+k+'"]');b.textContent=t[i+2];b.style.opacity=k===cat?'1':'.65'});$('contact').textContent=t[7];$('contactdesc').textContent=t[8];$('gallery').replaceChildren();const list=works.filter(a=>cat==='all'||a.category===cat);$('empty').textContent=list.length?'':t[6];for(const a of list){const card=document.createElement('div');card.className='art';const img=document.createElement('img');img.loading='lazy';img.src=a.url;img.alt=a.title;imageFallback(img,a);img.onclick=()=>{$('large').src=a.url;$('viewer').style.display='flex'};const p=document.createElement('p');p.textContent=a.title;card.append(img,p);$('gallery').append(card)}}function manage(){$('manage').replaceChildren();for(const a of works.filter(x=>x.owner_id===user?.id)){const p=document.createElement('p');p.textContent=a.title+' ';const b=document.createElement('button');b.textContent='Fshi';b.onclick=async()=>{if(!confirm('Ta fshij fotografinë?'))return;const {error}=await db.from('art_studio_artworks').delete().eq('id',a.id);if(error)return status(error.message);const rm=await db.storage.from('art-studio').remove([a.image_path]);if(rm.error)status('U fshi regjistrimi, por jo fotografia: '+rm.error.message);await refresh()};p.append(b);$('manage').append(p)}}async function refresh(){if(!db)return;const {data,error}=await db.from('art_studio_artworks').select('*').order('created_at',{ascending:false});if(error)return status('Gabim leximi: '+error.message);works=(data||[]).map(a=>({...a,url:photoUrl(a)}));render();manage()}async function sync(){const {data,error}=await db.auth.getUser();user=error?null:data.user;$('controls').classList.toggle('hide',!user);$('adminNote').textContent=user?'Administrimi është aktiv në këtë pajisje.':'Galeria është publike. Për të administruar duhet një sesion i autorizuar më parë në këtë shfletues.';manage()}async function connect(key){db=createClient(URL,key);return sync().then(refresh)}
$('upload').onclick=async()=>{if(!user)return;const f=$('photo').files[0],title=$('title').value.trim();if(!f||!title)return status('Vendos titullin dhe fotografinë.');if(!['image/jpeg','image/png','image/webp','image/gif'].includes(f.type)||f.size>10485760)return status('Lejohen JPG, PNG, WEBP, GIF deri në 10 MB.');const ext=f.type.split('/')[1].replace('jpeg','jpg'),path=user.id+'/'+crypto.randomUUID()+'.'+ext;status('Duke ngarkuar...');const {error}=await db.storage.from('art-studio').upload(path,f,{contentType:f.type,upsert:false});if(error)return status('Gabim ngarkimi: '+error.message);const {error:e}=await db.from('art_studio_artworks').insert({title,category:$('category').value,image_path:path,owner_id:user.id});if(e){await db.storage.from('art-studio').remove([path]);return status('Gabim publikimi: '+e.message)}$('photo').value='';$('title').value='';status('Fotografia u publikua.');await refresh();if(!works.some(a=>a.image_path===path))status('Fotografia u ngarkua, por nuk lexohet nga tabela. Kontrollo politikat SELECT/RLS.')};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});$('lang').onchange=render;$('close').onclick=()=>$('viewer').style.display='none';$('viewer').onclick=e=>{if(e.target===$('viewer'))$('viewer').style.display='none'};render();const publicKey='sb_publishable_v98f9BsnJosf0cvJE0B5Zw_tWNn4ZHE';connect(publicKey).catch(e=>status('Lidhja me galerinë dështoi: '+e.message));
</script></body></html>
