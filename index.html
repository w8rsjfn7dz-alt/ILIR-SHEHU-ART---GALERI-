<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ILIR SHEHU ART STUDIO</title><style>body{margin:0;background:#f6f4ef;color:#292720;font-family:system-ui}header{background:#1c2321;color:white;padding:24px;text-align:center}h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(32px,7vw,55px)}main{max-width:1100px;margin:auto;padding:20px}button,select,input{font:inherit;padding:12px;border-radius:9px;border:1px solid #aaa}button{background:#24342e;color:white;cursor:pointer;margin:4px}button.active{background:#a77c48}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin-top:25px}.art{background:white;border-radius:12px;overflow:hidden}.art img{width:100%;height:260px;object-fit:cover}.art p{padding:0 15px}.center{text-align:center}.panel{margin-top:70px;border-top:1px solid #ddd;padding:20px;background:#fff;border-radius:12px}input{width:90%;max-width:480px;margin:6px}.hide{display:none}#viewer{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center}#viewer img{max-width:94vw;max-height:85vh}#viewer button{position:absolute;right:15px;top:15px}</style></head><body><header><strong>ILIR SHEHU · ART STUDIO</strong><p><select id="lang"><option value="sq">Shqip</option><option value="sv">Svenska</option><option value="en">English</option></select></p></header><main><section class="center"><h1 id="heading"></h1><p id="intro"></p><div id="filters"><button data-cat="all"></button><button data-cat="painting"></button><button data-cat="drawing"></button><button data-cat="sculpture"></button></div></section><div id="gallery"></div><p class="center" id="empty"></p><section class="panel"><h2 id="contact"></h2><p id="contactdesc"></p><p><a href="mailto:" id="emailLink">Kontakt</a></p></section><section class="panel"><button id="toggle">Administrimi (Shqip)</button><div id="admin" class="hide"><h2>Paneli i pronarit</h2><p>Fotografitë që shton këtu ruhen vetëm në këtë shfletues. Për t'i parë të gjithë vizitorët, duhet lidhja me ruajtjen online dhe hyrja e sigurt.</p><label>Titulli <input id="title" placeholder="Emri i veprës"></label><p>Kategoria <select id="category"><option value="painting">Pikturë</option><option value="drawing">Vizatim</option><option value="sculpture">Skulpturë</option></select></p><p><input id="photo" type="file" accept="image/*"></p><button id="add">Shto për provë</button><p id="msg"></p><div id="manage"></div></div></section></main><div id="viewer"><button id="close">Mbyll ✕</button><img id="large" alt="Artwork"></div><script>
const t={sq:{heading:"Galeria ime artistike",intro:"Piktura, vizatime dhe skulptura nga Ilir Shehu",all:"Të gjitha",painting:"Piktura",drawing:"Vizatime",sculpture:"Skulptura",empty:"Albumi është ende bosh.",contact:"Porosi artistike",contactdesc:"Portrete, piktura, vizatime dhe skulptura me porosi."},sv:{heading:"Mitt konstgalleri",intro:"Målningar, teckningar och skulpturer av Ilir Shehu",all:"Alla",painting:"Målningar",drawing:"Teckningar",sculpture:"Skulpturer",empty:"Galleriet är ännu tomt.",contact:"Beställ konst",contactdesc:"Porträtt, målningar, teckningar och skulpturer på beställning."},en:{heading:"My art gallery",intro:"Paintings, drawings and sculptures by Ilir Shehu",all:"All",painting:"Paintings",drawing:"Drawings",sculpture:"Sculptures",empty:"The gallery is empty for now.",contact:"Commission art",contactdesc:"Custom portraits, paintings, drawings and sculptures."}};
const $=id=>document.getElementById(id);let cat='all',art=[];try{art=JSON.parse(localStorage.getItem('ilirArtDemo')||'[]')}catch{}
function render(){let tr=t[$('lang').value];for(let k of ['heading','intro','empty','contact','contactdesc'])$(k).textContent=tr[k];document.querySelectorAll('[data-cat]').forEach(b=>{b.textContent=tr[b.dataset.cat];b.classList.toggle('active',b.dataset.cat===cat)});$('gallery').replaceChildren();let list=art.filter(a=>cat==='all'||a.cat===cat);$('empty').style.display=list.length?'none':'block';for(let a of list){let box=document.createElement('div');box.className='art';let img=document.createElement('img');img.src=a.src;img.alt=a.title;img.onclick=()=>{$('large').src=a.src;$('viewer').style.display='flex'};let p=document.createElement('p');p.textContent=a.title+' · '+tr[a.cat];box.append(img,p);$('gallery').append(box)}$('manage').replaceChildren();art.forEach((a,i)=>{let p=document.createElement('p');p.textContent=a.title+' ';let b=document.createElement('button');b.textContent='Fshi';b.onclick=()=>{if(confirm('Ta fshij?')){art.splice(i,1);save()}};p.append(b);$('manage').append(p)})}
function save(){try{localStorage.setItem('ilirArtDemo',JSON.stringify(art));render()}catch{$('msg').textContent='Memoria e shfletuesit është plot. Fotoja nuk u ruajt.'}}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});$('lang').onchange=render;$('toggle').onclick=()=>$('admin').classList.toggle('hide');$('close').onclick=()=>$('viewer').style.display='none';$('viewer').onclick=e=>{if(e.target===$('viewer'))$('viewer').style.display='none'};
$('add').onclick=()=>{let f=$('photo').files[0],title=$('title').value.trim();if(!f||!title){$('msg').textContent='Vendos titullin dhe zgjidh fotografinë.';return}if(!f.type.startsWith('image/'))return;let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1100/im.width);c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);art.unshift({title,cat:$('category').value,src:c.toDataURL('image/jpeg',.75)});save();$('msg').textContent='U shtua vetëm në këtë pajisje (provë).';$('title').value='';$('photo').value=''};im.src=reader.result};reader.readAsDataURL(f)};render();
</script></body></html>
