<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ILIR SHEHU ART STUDIO</title><style>body{margin:0;background:#f6f4ef;color:#292720;font-family:system-ui}header{background:#1c2321;color:white;padding:24px;text-align:center}h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(32px,7vw,55px)}main{max-width:1100px;margin:auto;padding:20px}button,select,input{font:inherit;padding:12px;border-radius:9px;border:1px solid #aaa}button{background:#24342e;color:white;cursor:pointer;margin:4px}button.active{background:#a77c48}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin-top:25px}.art{background:white;border-radius:12px;overflow:hidden}.art img{width:100%;height:260px;object-fit:cover}.art p{padding:0 15px}.center{text-align:center}.panel{margin-top:70px;border-top:1px solid #ddd;padding:20px;background:#fff;border-radius:12px}input{width:90%;max-width:480px;margin:6px}.hide{display:none}#viewer{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center}#viewer img{max-width:94vw;max-height:85vh}#viewer button{position:absolute;right:15px;top:15px}</style></head><body><header><strong>ILIR SHEHU · ART STUDIO</strong><p><select id="lang"><option value="sq">Shqip</option><option value="sv">Svenska</option><option value="en">English</option></select></p></header><main><section class="center"><h1 id="heading"></h1><p id="intro"></p><div id="filters"><button data-cat="all"></button><button data-cat="painting"></button><button data-cat="drawing"></button><button data-cat="sculpture"></button></div></section><div id="gallery"></div><p class="center" id="empty"></p><section class="panel"><h2 id="contact"></h2><p id="contactdesc"></p><p><a href="mailto:" id="emailLink">Kontakt</a></p></section></main><div id="viewer"><button id="close">Mbyll ✕</button><img id="large" alt="Artwork"></div><script>
const t={sq:{heading:"Galeria ime artistike",intro:"Piktura, vizatime dhe skulptura nga Ilir Shehu",all:"Të gjitha",painting:"Piktura",drawing:"Vizatime",sculpture:"Skulptura",empty:"Albumi është ende bosh.",contact:"Porosi artistike",contactdesc:"Portrete, piktura, vizatime dhe skulptura me porosi."},sv:{heading:"Mitt konstgalleri",intro:"Målningar, teckningar och skulpturer av Ilir Shehu",all:"Alla",painting:"Målningar",drawing:"Teckningar",sculpture:"Skulpturer",empty:"Galleriet är ännu tomt.",contact:"Beställ konst",contactdesc:"Porträtt, målningar, teckningar och skulpturer på beställning."},en:{heading:"My art gallery",intro:"Paintings, drawings and sculptures by Ilir Shehu",all:"All",painting:"Paintings",drawing:"Drawings",sculpture:"Sculptures",empty:"The gallery is empty for now.",contact:"Commission art",contactdesc:"Custom portraits, paintings, drawings and sculptures."}};
const $=id=>document.getElementById(id);let cat='all',art=[];
function render(){const tr=t[$('lang').value];for(const k of ['heading','intro','empty','contact','contactdesc'])$(k).textContent=tr[k];document.querySelectorAll('[data-cat]').forEach(b=>{b.textContent=tr[b.dataset.cat];b.classList.toggle('active',b.dataset.cat===cat)});$('gallery').replaceChildren();const list=art.filter(a=>cat==='all'||a.cat===cat);$('empty').style.display=list.length?'none':'block';for(const a of list){const box=document.createElement('div');box.className='art';const img=document.createElement('img');img.src=a.src;img.alt=a.title;img.onclick=()=>{$('large').src=a.src;$('viewer').style.display='flex'};const p=document.createElement('p');p.textContent=a.title+' · '+tr[a.cat];box.append(img,p);$('gallery').append(box)}}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});$('lang').onchange=render;$('close').onclick=()=>$('viewer').style.display='none';$('viewer').onclick=e=>{if(e.target===$('viewer'))$('viewer').style.display='none'};render();
</script><script type="module">
let db=null;
const $=id=>document.getElementById(id);
const panel=document.createElement('section');panel.className='panel';panel.innerHTML='<h2>Menaxho fotografitë</h2><div id="loginArea"><input id="artEmail" type="email" placeholder="Email"><input id="artPassword" type="password" placeholder="Fjalëkalimi"><button id="artLogin">Hyr</button></div><div id="artControls" class="hide"><p><button id="artLogout">Dil</button></p><input id="artTitle" placeholder="Titulli i veprës"><select id="artCategory"><option value="sculpture">Skulpturë</option><option value="painting">Pikturë</option><option value="drawing">Vizatim</option></select><input id="artPhoto" type="file" accept="image/*"><button id="artPublish">Shto foto</button><div id="artManage"></div></div><p id="artStatus" role="status"></p>';
document.querySelector('main').append(panel);
let user=null,publicArt=[];
const status=s=>$('artStatus').textContent=s;
async function refresh(){const {data,error}=await db.from('art_studio_artworks').select('*').order('created_at',{ascending:false});if(error){status(error.message);return}publicArt=(data||[]).map(a=>({title:a.title,cat:a.category,src:db.storage.from('art-studio').getPublicUrl(a.image_path).data.publicUrl,id:a.id,path:a.image_path,owner:a.owner_id}));art=[...publicArt];render();manage()}
function manage(){$('artManage').replaceChildren();for(const a of publicArt.filter(a=>a.owner===user?.id)){const p=document.createElement('p');p.textContent=a.title+' ';const b=document.createElement('button');b.textContent='Fshi';b.onclick=async()=>{if(!confirm('Ta fshij fotografinë nga galeria publike?'))return;const {error}=await db.from('art_studio_artworks').delete().eq('id',a.id);if(error){status(error.message);return}await db.storage.from('art-studio').remove([a.path]);await refresh()};p.append(b);$('artManage').append(p)}}
async function sync(){const {data:{user:u}}=await db.auth.getUser();user=u;$('loginArea').classList.toggle('hide',!!u);$('artControls').classList.toggle('hide',!u);manage()}
$('artLogin').onclick=async()=>{status('Duke kontrolluar hyrjen...');if(!db){status('Lidhja me Supabase nuk është gati. Rifresko faqen.');return}try{const {error}=await db.auth.signInWithPassword({email:$('artEmail').value.trim(),password:$('artPassword').value});if(error)status(error.message);else{status('Hyrja u krye.');await sync()}}catch(e){status('Gabim lidhjeje: '+e.message)}};
$('artLogout').onclick=async()=>{await db.auth.signOut();await sync()};
$('artPublish').onclick=async()=>{if(!user)return;const file=$('artPhoto').files[0],title=$('artTitle').value.trim();if(!file||!title){status('Vendos titullin dhe fotografinë.');return}if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)||file.size>10485760){status('Zgjidh JPG, PNG, WEBP ose GIF deri në 10 MB.');return}const ext=file.name.split('.').pop().toLowerCase();const path=user.id+'/'+crypto.randomUUID()+'.'+ext;status('Duke ngarkuar...');const {error:e}=await db.storage.from('art-studio').upload(path,file,{contentType:file.type});if(e){status(e.message);return}const {error:d}=await db.from('art_studio_artworks').insert({title,category:$('artCategory').value,image_path:path,owner_id:user.id});if(d){await db.storage.from('art-studio').remove([path]);status(d.message);return}$('artPhoto').value='';$('artTitle').value='';status('Fotografia u publikua.');await refresh()};
status('Duke lidhur galerinë...');
try {
 let mod;
 try { mod=await import('https://esm.sh/@supabase/supabase-js@2'); }
 catch(firstError) { mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'); }
 db=mod.createClient('https://kkxuuiejdtsahvmqxdja.supabase.co','sb_publishable_v98f9BsnJosf0cvJE0B5Zw_tWNn4ZHE');
 status('Hyrja është gati.');
 await sync();await refresh();
} catch(e) { status('Lidhja nuk u ngarkua: '+e.message); }
</script></body></html>
